<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family-DCA 宽基定投</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
header h1 { font-size: 20px; font-weight: 600; }
header .sub { font-size: 13px; color: #94a3b8; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; transition: transform .15s, box-shadow .15s; border: 1px solid #334155; text-decoration: none; color: inherit; display: block; }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.4); border-color: #475569; }
.card .code { font-size: 12px; color: #64748b; }
.card .name { font-size: 18px; font-weight: 700; margin: 4px 0 10px; }
.card .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
.card .label { color: #94a3b8; }
.card .val { font-weight: 600; }
.card .bt-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155; }
.card .bt-row .label { color: #64748b; font-size: 11px; }
.card .bt-row .val { font-size: 13px; }
.peg-green { color: #4ade80; }
.peg-yellow { color: #facc15; }
.peg-red { color: #f87171; }
.category-section { margin-bottom: 28px; }
.category-section h2 { font-size: 15px; color: #94a3b8; margin-bottom: 10px; border-left: 3px solid #3b82f6; padding: 2px 12px; }
.loading { text-align: center; padding: 60px; color: #64748b; }
.bt-na { color: #475569; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Family-DCA 宽基定投</h1>
    <span class="sub">数据更新: <span id="update-time">加载中...</span></span>
  </div>
</header>
<div class="container">
  <div id="content" class="loading">加载中...</div>
</div>
<script>
const CODE = '';

function pctClass(v) {
  if (v == null) return '';
  if (v < 30) return 'peg-green';
  if (v < 70) return 'peg-yellow';
  return 'peg-red';
}

function pctLabel(v) {
  if (v == null) return '—';
  return v.toFixed(0) + '%';
}

function fmtPct(v) {
  if (v == null) return '—';
  return (v * 100).toFixed(1) + '%';
}

function fedClass(v) {
  if (v == null) return '';
  return v > 0 ? 'peg-green' : 'peg-red';
}

async function load() {
  try {
    const [indicesResp, btResp] = await Promise.all([
      fetch('/api/indices'),
      fetch('/api/indices/backtest')
    ]);
    const indices = await indicesResp.json();
    const btData = await btResp.json();
    const btMap = {};
    for (const b of btData) { btMap[b.code] = b; }
    render(indices, btMap);
  } catch(e) {
    document.getElementById('content').innerHTML = '加载失败: ' + e.message;
  }
}

function render(data, btMap) {
  const cats = {};
  for (const item of data) {
    const c = item.category;
    if (!cats[c]) cats[c] = [];
    cats[c].push(item);
  }
  const catOrder = ['宽基', '红利', '港股通', '港股', '美股', '质量'];
  const catNames = {宽基:'宽基指数', 红利:'红利指数', 港股通:'港股通指数', 港股:'港股指数', 美股:'美股指数', 质量:'质量成长'};

  let html = '';
  for (const cat of catOrder) {
    if (!cats[cat]) continue;
    html += `<div class="category-section"><h2>${catNames[cat]||cat}</h2><div class="summary">`;
    for (const item of cats[cat]) {
      const bt = btMap[item.code];
      let w = item.date || '—';
      if (w.length > 10) w = w.slice(0,10);
      html += `
      <a href="/analysis/${item.code}" class="card">
        <div class="code">${item.code}</div>
        <div class="name">${item.name}</div>
        <div class="row"><span class="label">PE</span><span class="val">${item.pe != null ? item.pe.toFixed(2) : '—'}</span></div>
        <div class="row"><span class="label">PE百分位</span><span class="val ${pctClass(item.pe_pct)}">${pctLabel(item.pe_pct)}</span></div>
        <div class="row"><span class="label">FED</span><span class="val ${fedClass(item.fed)}">${item.fed != null ? item.fed.toFixed(2)+'%' : '—'}</span></div>
        <div class="row"><span class="label">PB百分位</span><span class="val ${pctClass(item.pb_pct_dj)}">${pctLabel(item.pb_pct_dj)}</span></div>
        ${bt ? `
        <div class="bt-row">
          <div class="row"><span class="label">XIRR / 回报</span><span class="val ${bt.xirr>0?'peg-green':'peg-red'}">${(bt.xirr*100).toFixed(1)}% / ${(bt.final_return*100).toFixed(1)}%</span></div>
          <div class="row"><span class="label">交易 / 买入次数</span><span class="val">${bt.trades} / ${bt.buys}</span></div>
          <div class="row"><span class="label">PE阈值(买) / 窗口</span><span class="val">${(bt.pe_buy_floor*100).toFixed(0)}%~${(bt.pe_buy_high*100).toFixed(0)}% / ${bt.window_years}yr</span></div>
        </div>` : '<div class="bt-row"><span class="bt-na">数据不足, 无法回测</span></div>'}
      </a>`;
    }
    html += '</div></div>';
  }
  document.getElementById('content').innerHTML = html;
  document.getElementById('update-time').textContent = new Date().toLocaleString();
}

load();
</script>
</body>
</html>
